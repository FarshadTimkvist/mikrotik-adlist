
name: Update Balanced MikroTik Adlist V2

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

concurrency:
  group: balanced-adlist-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build improved MikroTik adlist
        shell: bash
        run: |
          python3 - <<'PY'
          import ipaddress
          import re
          import urllib.request
          from collections import Counter
          from pathlib import Path

          SOURCES = {
              "AdGuard DNS Filter":
                  "https://adguardteam.github.io/"
                  "HostlistsRegistry/assets/filter_1.txt",
              "AdAway Default Blocklist":
                  "https://adguardteam.github.io/"
                  "HostlistsRegistry/assets/filter_2.txt",
          }

          OUTPUT = Path("adlist-balanced-v2.txt")
          REPORT = Path("adlist-v2-report.txt")

          MIN_DOMAINS = 10000
          MAX_DOMAINS = 300000
          MAX_BYTES = 10_000_000

          DOMAIN = re.compile(
              r"(?i)^(?:[a-z0-9](?:[a-z0-9-]*"
              r"[a-z0-9])?\.)+"
              r"[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
          )

          RULE = re.compile(
              r"^(\|\||\|)([a-z0-9.-]+)\^?$",
              re.IGNORECASE
          )

          blocked = set()
          exceptions = set()
          stats = Counter()
          report = []

          def valid_domain(value):
              if not DOMAIN.fullmatch(value):
                  return False
              if len(value) > 253:
                  return False
              if any(len(part) > 63
                     for part in value.split(".")):
                  return False
              return True

          def parse_rule(raw):
              line = raw.strip().lower()

              if not line:
                  return None, None, "empty"

              if line.startswith(("!", "#", "[")):
                  return None, None, "comment"

              # Do not silently reinterpret unsupported
              # AdGuard modifiers as unconditional blocks.
              if "$" in line:
                  pattern, modifiers = line.split("$", 1)
                  modifiers = modifiers.split(",")

                  if not modifiers or any(
                      m != "important" for m in modifiers
                  ):
                      return None, None, "unsupported_modifier"

                  line = pattern

              exception = line.startswith("@@")
              if exception:
                  line = line[2:]

              # Domain-only syntax
              if valid_domain(line):
                  return (
                      "exception" if exception else "block",
                      line,
                      "plain"
                  )

              # AdGuard domain anchor:
              # ||example.com^
              # |example.com^
              match = RULE.fullmatch(line)

              if match:
                  domain = match.group(2).rstrip(".")

                  if valid_domain(domain):
                      return (
                          "exception" if exception else "block",
                          domain,
                          "adguard"
                      )

              # Hosts format
              if not exception:
                  parts = line.split()

                  if len(parts) == 2:
                      address, domain = parts

                      try:
                          ip = ipaddress.ip_address(address)
                      except ValueError:
                          ip = None

                      allowed_ips = {
                          "0.0.0.0",
                          "127.0.0.1",
                          "::",
                          "::1",
                      }

                      if (
                          ip is not None
                          and str(ip) in allowed_ips
                          and valid_domain(domain)
                      ):
                          return "block", domain, "hosts"

              return None, None, "unsupported_pattern"

          def download(name, url):
              print(f"Downloading {name}", flush=True)

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "MikroTik-Adlist-V2/1.0"
                  },
              )

              with urllib.request.urlopen(
                  request, timeout=120
              ) as response:
                  content = response.read(
                      25_000_001
                  )

              if len(content) > 25_000_000:
                  raise RuntimeError(
                      f"{name}: source exceeds 25 MB"
                  )

              text = content.decode(
                  "utf-8-sig", errors="replace"
              )

              if len(text) < 10000:
                  raise RuntimeError(
                      f"{name}: source unexpectedly small"
                  )

              return text

          for name, url in SOURCES.items():
              content = download(name, url)

              source_blocks = set()
              source_exceptions = set()
              source_stats = Counter()

              for raw in content.splitlines():
                  action, domain, kind = parse_rule(raw)
                  source_stats[kind] += 1

                  if action == "block":
                      source_blocks.add(domain)
                  elif action == "exception":
                      source_exceptions.add(domain)

              if len(source_blocks) < 1000:
                  raise RuntimeError(
                      f"{name}: too few block domains: "
                      f"{len(source_blocks)}"
                  )

              blocked.update(source_blocks)
              exceptions.update(source_exceptions)
              stats.update(source_stats)

              report.append(
                  f"{name}: "
                  f"{len(source_blocks)} block domains, "
                  f"{len(source_exceptions)} exceptions"
              )

              print(report[-1], flush=True)

          before = len(blocked)

          # An exception for a parent domain protects
          # that name and explicitly listed descendants.
          # This is conservative because RouterOS adlist
          # cannot reproduce AdGuard's rule priorities.
          def protected(domain):
              current = domain

              while True:
                  if current in exceptions:
                      return True

                  if "." not in current:
                      return False

                  current = current.split(".", 1)[1]

          final_domains = {
              domain for domain in blocked
              if not protected(domain)
          }

          removed = before - len(final_domains)
          total = len(final_domains)

          if not MIN_DOMAINS <= total <= MAX_DOMAINS:
              raise RuntimeError(
                  f"Unexpected domain count: {total}"
              )

          data = "\n".join(
              sorted(final_domains)
          ) + "\n"

          size = len(data.encode("utf-8"))

          if size > MAX_BYTES:
              raise RuntimeError(
                  f"File too large: {size} bytes"
              )

          # Safety checks for essential services.
          protected_services = {
              "api.klart.se",
              "app-api-v1.klart.se",
              "apple.com",
              "icloud.com",
              "github.com",
              "raw.githubusercontent.com",
          }

          conflicts = (
              final_domains & protected_services
          )

          if conflicts:
              raise RuntimeError(
                  "Protected services found: "
                  + ", ".join(sorted(conflicts))
              )

          # Verify generated output before writing.
          lines = data.splitlines()

          if len(lines) != total:
              raise RuntimeError(
                  "Output line count mismatch"
              )

          if any(
              not valid_domain(d) for d in lines
          ):
              raise RuntimeError(
                  "Invalid domain in output"
              )

          OUTPUT.write_text(
              data, encoding="utf-8"
          )

          report.extend([
              "",
              f"Unique candidates: {before}",
              f"Removed by exceptions: {removed}",
              f"Final domains: {total}",
              f"File size: {size / 1000000:.2f} MB",
              "",
              "Rule statistics:",
          ])

          for key, value in sorted(stats.items()):
              report.append(f"{key}: {value}")

          report.extend([
              "",
              "Compatibility notes:",
              "MikroTik blocks exact names only.",
              "Subdomains are not generated automatically.",
              "Unsupported modifiers and patterns are skipped.",
              "AdGuard rule priority is not fully reproduced.",
              "DNS blocking cannot remove all in-app ads.",
          ])

          REPORT.write_text(
              "\n".join(report) + "\n",
              encoding="utf-8"
          )

          print("\n".join(report), flush=True)
          print("V2 build completed successfully")
          PY

      - name: Publish V2 build summary
        if: success()
        shell: bash
        run: |
          cat adlist-v2-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Commit V2 list and report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            adlist-balanced-v2.txt \
            adlist-v2-report.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update improved MikroTik adlist V2"
            git push
          else
            echo "No changes to commit"
          fi
