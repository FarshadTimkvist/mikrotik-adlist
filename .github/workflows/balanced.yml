
name: Update Balanced MikroTik Adlist

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

concurrency:
  group: balanced-adlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build AdGuard and AdAway list
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from pathlib import Path

          sources = {
              "AdGuard DNS Filter":
                  "https://adguardteam.github.io/"
                  "HostlistsRegistry/assets/filter_1.txt",

              "AdAway Default Blocklist":
                  "https://adguardteam.github.io/"
                  "HostlistsRegistry/assets/filter_2.txt",
          }

          valid = re.compile(
              r"(?i)^(?:[a-z0-9](?:[a-z0-9-]*"
              r"[a-z0-9])?\.)+"
              r"[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
          )

          adblock = re.compile(
              r"^\|\|([a-z0-9.-]+)\^$",
              re.IGNORECASE
          )

          domains = set()

          for name, url in sources.items():
              print(f"Downloading {name}", flush=True)

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "MikroTik-Adlist/1.0"
                  }
              )

              with urllib.request.urlopen(
                  request, timeout=120
              ) as response:
                  content = response.read().decode(
                      "utf-8", errors="replace"
                  )

              source_domains = set()

              for raw_line in content.splitlines():
                  line = raw_line.strip().lower()

                  if not line or line.startswith(
                      ("!", "#", "[", "@@")
                  ):
                      continue

                  domain = None

                  match = adblock.fullmatch(line)

                  if match:
                      domain = match.group(1)

                  elif valid.fullmatch(line):
                      domain = line

                  else:
                      parts = line.split()

                      if (
                          len(parts) == 2
                          and parts[0] in (
                              "0.0.0.0",
                              "127.0.0.1"
                          )
                      ):
                          domain = parts[1]

                  if domain and valid.fullmatch(domain):
                      source_domains.add(domain)

              count = len(source_domains)

              print(
                  f"{name}: {count} valid domains",
                  flush=True
              )

              if count < 1000:
                  raise RuntimeError(
                      f"{name}: too few domains"
                  )

              domains.update(source_domains)

          total = len(domains)

          print(
              f"Total unique domains: {total}",
              flush=True
          )

          # Safety checks for MikroTik hAP ax2
          if not 10000 <= total <= 600000:
              raise RuntimeError(
                  f"Unexpected domain count: {total}"
              )

          output = Path("adlist-balanced.txt")

          data = "\n".join(sorted(domains)) + "\n"
          size_mb = len(data.encode("utf-8")) / 1000000

          print(
              f"Final file size: {size_mb:.2f} MB",
              flush=True
          )

          if size_mb > 15:
              raise RuntimeError(
                  f"File too large: {size_mb:.2f} MB"
              )

          output.write_text(
              data,
              encoding="utf-8"
          )

          print("Adlist created successfully")
          PY

      - name: Commit balanced list
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add adlist-balanced.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update AdGuard and AdAway list"
            git push
          fi
