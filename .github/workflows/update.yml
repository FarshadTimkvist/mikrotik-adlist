
name: Update MikroTik Adlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download and merge AdGuard filters
        run: |
          python3 - <<'PY'
          import ipaddress
          import re
          import urllib.request

          domains = set()
          successful = 0

          valid = re.compile(
              r"(?i)^(?:[a-z0-9-]+\.)+[a-z0-9-]+$"
          )

          for i in range(1, 101):
              url = (
                  "https://adguardteam.github.io/"
                  "HostlistsRegistry/assets/"
                  f"filter_{i}.txt"
              )

              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      content = response.read().decode(
                          "utf-8", errors="replace"
                      )
                  successful += 1
                  print(f"Downloaded filter_{i}.txt")
              except Exception as error:
                  print(f"Skipped filter_{i}: {error}")
                  continue

              for line in content.splitlines():
                  line = line.strip().lower()

                  if not line or line.startswith(
                      ("!", "#", "[", "@@")
                  ):
                      continue

                  domain = None

                  if line.startswith("||"):
                      match = re.fullmatch(
                          r"\|\|([a-z0-9.-]+)\^",
                          line
                      )
                      if match:
                          domain = match.group(1)

                  elif line.startswith(
                      ("0.0.0.0 ", "127.0.0.1 ")
                  ):
                      parts = line.split()
                      if len(parts) == 2:
                          domain = parts[1]

                  elif valid.fullmatch(line):
                      domain = line

                  if domain and valid.fullmatch(domain):
                      try:
                          ipaddress.ip_address(domain)
                      except ValueError:
                          domains.add(domain)

          if successful == 0 or not domains:
              raise RuntimeError(
                  "No valid filter data downloaded"
              )

          with open("adlist.txt", "w") as output:
              for domain in sorted(domains):
                  output.write(domain + "\n")

          print(f"Downloaded filters: {successful}")
          print(f"Unique domains: {len(domains)}")
          PY

      - name: Save updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add adlist.txt
          git diff --cached --quiet || \
            (git commit -m "Update adlist" && git push)
